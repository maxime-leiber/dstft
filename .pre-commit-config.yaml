# Fichier de configuration pour pre-commit
# Voir https://pre-commit.com pour plus d'informations

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Dependabot ("pre-commit" ecosystem) garde ce rev à jour automatiquement
    rev: v0.16.2
    hooks:
      # Exécute le linter ruff et corrige automatiquement les problèmes simples
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Exécute le formateur ruff
      - id: ruff-format

  - repo: local
    hooks:
      # Hook local (pas le mirror officiel) pour réutiliser l'environnement déjà
      # installé (torch, matplotlib) au lieu d'un venv isolé qui devrait tout
      # réinstaller. Ne couvre que src/dstft (voir [tool.mypy] dans pyproject.toml) :
      # les tests ne sont volontairement pas typés (cf. discussion précédente).
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        files: ^src/dstft/
        pass_filenames: false

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      # Docstring coverage on src/dstft/ (config + threshold in pyproject.toml).
      - id: interrogate
        args: [-c, pyproject.toml]
        pass_filenames: false
